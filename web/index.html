<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>한우 스마트 컨설팅 시스템</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 한우 업무 시스템 공통 디자인 — 2026-11-01 새 기준 (시험농장/DESIGN.md · hanwoo-portal/theme/hanwoo-theme.css 와 같은 값).
       중립 회색 바탕 · 잉크색(거의 검정) 단추 · 장부 녹색(accent)은 데이터·고른 표시에만 · 이모지 쓰지 않음.
       모서리 두 가지(상자 6px·입력칸 4px) — 화면 코드의 rounded-2xl/xl/lg 를 그대로 두고 값만 바꾼다. -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      --font-serif: "Noto Serif KR", "Batang", "AppleMyungjo", serif;
      --color-brand: #1E2423;
      --color-brand-dark: #0D1110;
      --color-brand-tint: #EEF0F0;
      --color-brand-line: #D3D8D7;
      --color-accent: #1F6B5E;
      --color-page: #F5F6F6;
      --color-panel: #EEF0F0;
      --color-line: #E1E4E4;
      --color-ink: #161A19;
      --color-muted: #59605F;
      --color-pos: #1E7A4F;
      --color-neg: #B4321F;
      --radius-2xl: 6px;
      --radius-xl: 6px;
      --radius-lg: 6px;
      --radius-md: 4px;
    }
  </style>
  <link rel="stylesheet" href="app.css">
</head>
<body class="bg-page text-ink font-sans antialiased">

  <!-- 로그인 -->
  <section id="login" class="hidden max-w-sm mx-auto mt-16 px-5">
    <h1 class="text-2xl font-semibold font-serif mb-1">한우 스마트 컨설팅</h1>
    <p class="text-sm text-muted mb-6">대구축협 지도컨설팅 직원 전용입니다. 접속 비밀번호를 입력하세요.</p>
    <form id="login-form" class="space-y-3">
      <label class="block text-sm font-medium" for="login-pw">접속 비밀번호</label>
      <input id="login-pw" type="password" autocomplete="current-password" required
             class="w-full rounded-xl border border-line bg-white px-4 py-3 text-base focus:outline-2 focus:outline-brand">
      <p id="login-error" class="hidden text-sm text-neg" role="alert"></p>
      <button class="w-full rounded-xl bg-brand text-white py-3 text-base font-semibold active:opacity-80">들어가기</button>
    </form>
  </section>

  <!-- 본 화면: 위 머리글 + 가운데 내용 + 아래 메뉴 -->
  <div id="app" class="hidden">
    <header class="app-header sticky top-0 z-20 bg-white border-b border-line">
      <div class="max-w-3xl mx-auto px-4 h-14 flex items-center gap-3">
        <span class="w-8 h-8 shrink-0 rounded-md bg-brand text-white text-sm font-semibold grid place-items-center" aria-hidden="true">컨</span>
        <div id="farm-picker" class="relative flex-1 min-w-0">
          <button id="farm-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="컨설팅 농가 선택"
                  class="w-full flex items-center justify-between gap-2 rounded-xl border border-line bg-white px-3 py-2 text-base font-semibold text-left focus:outline-2 focus:outline-brand">
            <span id="farm-btn-label" class="truncate">전체 농가</span><span aria-hidden="true" class="text-muted">▾</span></button>
          <div id="farm-panel" class="hidden absolute left-0 right-0 top-full mt-1 z-30 rounded-2xl border border-line bg-white shadow-lg p-2">
            <label class="sr-only" for="farm-search">농가 검색</label>
            <input id="farm-search" type="search" autocomplete="off" placeholder="농가명·대표자·지역 검색"
                   class="w-full rounded-xl border border-line bg-white px-3 py-2 text-base focus:outline-2 focus:outline-brand">
            <div id="farm-scope" class="flex gap-2 mt-2" role="group" aria-label="농가 구분"></div>
            <div id="farm-list" class="max-h-[55vh] overflow-y-auto mt-2" role="listbox" aria-label="농가 목록"></div>
          </div>
        </div>
        <button id="logout" class="hidden shrink-0 rounded-xl border border-line bg-white px-3 py-2 text-sm active:bg-panel">로그아웃</button>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-4 pb-28"><div id="flash"></div><div id="page"></div></main>

    <nav id="tabbar" class="tabbar fixed bottom-0 inset-x-0 z-20 bg-white border-t border-line" aria-label="메뉴">
      <div class="max-w-3xl mx-auto grid grid-cols-5"></div>
    </nav>
  </div>

  <div id="toast" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-30 rounded-lg bg-ink text-white px-4 py-2 text-sm shadow-lg"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
